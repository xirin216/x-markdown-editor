[package]
name = "x-markdown-editor"
version = "0.1.0"
description = "A Windows markdown editor for files anywhere on disk."
authors = ["xirin"]
edition = "2021"

[lib]
name = "x_markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
walkdir = "2"
font-kit = "0.14"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
